<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Admin</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-dark fixed-top navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Ecommerce App</a>
    </div>
</nav>

<div class="container" style="margin-top: 100px;">

    <div class="row mb-3">
        <div class="col">
            <a th:href="@{/admin/home}" class="btn btn-primary">
                ← Back to Admin Home
            </a>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-header bg-success text-white text-center">
            <h4>Update Existing Admin Details</h4>
        </div>

        <div class="card-body">
            <form th:action="@{/update/admin}"
                  th:object="${admin}"
                  method="post">

                <!-- Hidden ID -->
                <input type="hidden" th:field="*{id}" />

                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label">Admin Name</label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           required />
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Admin Email</label>
                    <input type="email"
                           th:field="*{email}"
                           class="form-control"
                           required />
                </div>

                <!-- Submit -->
                <div class="text-center">
                    <button type="submit" class="btn btn-success">
                        Update Admin
                    </button>
                </div>

            </form>
        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
