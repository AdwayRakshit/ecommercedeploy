<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">

    <style>
        body {
            padding-top: 80px; /* prevents navbar overlap */
        }

        .product-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand me-5" th:href="@{/}">Ecommerce App</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item me-4">
                    <a class="nav-link" th:href="@{/home}">Home</a>
                </li>
                <li class="nav-item me-4">
                    <a class="nav-link" th:href="@{/aboutUs}">About Us</a>
                </li>
                <li class="nav-item me-4">
                    <a class="nav-link active" th:href="@{/products}">Products</a>
                </li>
                <li class="nav-item me-4">
                    <a class="nav-link" th:href="@{/contactUs}">Contact Us</a>
                </li>
            </ul>

            <a th:href="@{/login}" class="btn btn-success">Login</a>
        </div>
    </div>
</nav>

<!-- Products Section -->
<section class="container py-5">
    <h2 class="text-center mb-5">Our Products</h2>

    <div class="row g-4">
        <div class="col-md-4" th:each="p : ${productList}">
            <div class="card product-card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${p.name}">Product Name</h5>

                    <p class="card-text fw-bold text-success mt-2">
                        <span th:text="'₹ ' + ${p.price}">₹ 0</span>
                    </p>

                    <div class="mt-auto">
                        <a th:href="@{/login}" class="btn btn-success w-100 buy-btn">
                            Buy Now
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<!-- Buy button logic -->
<script>
    document.querySelectorAll(".buy-btn").forEach(button => {
        button.addEventListener("click", function (e) {
            e.preventDefault();
            alert("Please login to buy this product");
            window.location.href = "/login";
        });
    });
</script>

</body>
</html>
